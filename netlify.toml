[build]
  command = "npm ci && npm run build -w @mailyflex/web"
  publish = "apps/web/dist"

[build.environment]
  NODE_VERSION = "22"
  # Public by design: both values are shipped to every browser. Data is protected by row-level security.
  VITE_SUPABASE_URL = "https://jxwjmisezpkbzbjjbjde.supabase.co"
  VITE_SUPABASE_ANON_KEY = "sb_publishable_Fq-c_PuDwaycHYapqZRDbA_uIau0gNE"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
